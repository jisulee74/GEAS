dataset:
  crop: cucumber
  train: ../../../offline_dataset_preparation/datasets/5_rl_dataset/cucumber/train.parquet
  validation: ../../../offline_dataset_preparation/datasets/5_rl_dataset/cucumber/validation.parquet
  test: ../../../offline_dataset_preparation/datasets/5_rl_dataset/cucumber/test.parquet

experiment:
  output_dir: artifacts/default
  random_seed: 42

models:
  candidates:
    - name: persistence
      params: {}
    - name: linear_regression
      params: {}
    - name: linear_svr
      params:
        random_state: 42
    - name: knn
      params:
        n_neighbors: 5
    - name: extra_trees
      params:
        n_estimators: 100
        random_state: 42
        n_jobs: -1
    - name: lightgbm
      params:
        random_state: 42
    - name: xgboost
      params:
        random_state: 42
    - name: mlp
      params:
        multi_output_strategy: independent
        hidden_layer_sizes: [64, 32]
        max_iter: 300
        random_state: 42

selection:
  strategy: mean_rmse
  params: {}

rollout:
  enabled: true
  horizon_steps: [3, 6, 12]
  step_minutes: 5
